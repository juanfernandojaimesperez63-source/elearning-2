{% extends 'base.html' %}{% block contenido %}<h1>{{ evaluacion.titulo }}</h1><p class="alerta info">Tiempo restante: <strong id="temporizador" data-segundos="{{ restantes }}"></strong></p><form method="post" id="resolucion" action="{{ url_for('evaluaciones.enviar',id=entrega.id) }}"><input type="hidden" name="csrf" value="{{ csrf }}">{% for p in preguntas %}<fieldset class="tarjeta" data-pregunta><legend>{{ loop.index }}. {{ p.enunciado }} ({{ p.puntaje|nota }})</legend>{% for o in p.opciones %}<label class="opcion"><input type="radio" name="respuesta_{{ p.id }}" value="{{ o.id }}">{{ o.texto }}</label>{% endfor %}</fieldset>{% endfor %}{{ boton('Enviar evaluación') }}</form><script src="{{ url_for('static',filename='js/temporizador.js') }}" defer></script>{% endblock %}
